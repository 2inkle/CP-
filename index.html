<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>리치 마작</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="start-screen">
  <div class="start-box">
    <div class="brand">
      <span class="brand-mark">雀</span>
      <h1>리치 마작</h1>
    </div>
    <p class="sub">일본식 리치 마작(정통 룰) · 컴퓨터 3명과 東風戦</p>
    <ul class="rules-note">
      <li>화료: 4세트+1쌍 · 치또이츠(7쌍) · 국사무쌍</li>
      <li>리치 · 멘젠쯔모 · 핀후 · 탄야오 · 역패 · 도라 등 표준 역 다수 지원</li>
      <li>깡은 <b>안깡(暗槓)</b>만 지원 (밍깡/가깡 미지원)</li>
      <li>치는 본인 바로 앞 사람(上家) 버림패에만 가능</li>
    </ul>
    <div class="persona-picker">
      <div class="persona-picker-title">AI 조패 경향 선택</div>
      <div class="persona-row"><span>AI-1 (下家)</span><select id="persona-1" class="persona-select"></select></div>
      <div class="persona-row"><span>AI-2 (対面)</span><select id="persona-2" class="persona-select"></select></div>
      <div class="persona-row"><span>AI-3 (上家)</span><select id="persona-3" class="persona-select"></select></div>
      <div id="persona-desc" class="persona-desc"></div>
    </div>
    <button id="start-btn" class="bigbtn">대국 시작</button>
  </div>
</div>

<div id="game-screen" style="display:none;">

  <div id="table">

    <!-- 대면 (상단) -->
    <div class="seat seat-top" id="seat-2">
      <div class="seatcard">
        <div class="avatar avatar-2">AI</div>
        <div class="seat-meta">
          <div class="seat-namerow"><span class="pname" id="pname-2"></span><span class="windchip" id="wind-2"></span></div>
          <div class="pscore" id="pscore-2"></div>
        </div>
        <div class="tags" id="tags-2"></div>
      </div>
      <div class="discards" id="discards-2"></div>
      <div class="hand ai-hand" id="hand-2"></div>
    </div>

    <div class="seat-row middle">

      <!-- 상가 (좌측) -->
      <div class="seat seat-left" id="seat-3">
        <div class="seatcard">
          <div class="avatar avatar-3">AI</div>
          <div class="seat-meta">
            <div class="seat-namerow"><span class="pname" id="pname-3"></span><span class="windchip" id="wind-3"></span></div>
            <div class="pscore" id="pscore-3"></div>
          </div>
          <div class="tags" id="tags-3"></div>
        </div>
        <div class="discards" id="discards-3"></div>
        <div class="hand ai-hand" id="hand-3"></div>
      </div>

      <!-- 중앙 정보 패널 -->
      <div class="center-panel">
        <div class="center-diamond">
          <div class="center-inner">
            <div id="roundinfo" class="round-label">東1局</div>
            <div class="honba-label" id="honba-label"></div>
            <div class="center-dora">
              <span class="mini-caption">도라</span>
              <div id="dora-indicators" class="mini-tiles"></div>
            </div>
            <div class="center-stats">
              <span id="wallcount">잔패 70</span>
              <span id="stickcount">공탁 0</span>
            </div>
          </div>
        </div>
        <button id="log-toggle" class="log-toggle-btn" title="기록 보기">☰ 기록</button>
      </div>

      <!-- 하가 (우측) -->
      <div class="seat seat-right" id="seat-1">
        <div class="seatcard">
          <div class="avatar avatar-1">AI</div>
          <div class="seat-meta">
            <div class="seat-namerow"><span class="pname" id="pname-1"></span><span class="windchip" id="wind-1"></span></div>
            <div class="pscore" id="pscore-1"></div>
          </div>
          <div class="tags" id="tags-1"></div>
        </div>
        <div class="discards" id="discards-1"></div>
        <div class="hand ai-hand" id="hand-1"></div>
      </div>

    </div>

    <!-- 나 (하단) -->
    <div class="seat seat-bottom" id="seat-0">
      <div class="discards" id="discards-0"></div>
      <div class="hand human-hand" id="hand-0"></div>
      <div class="seatcard self">
        <div class="avatar avatar-0">나</div>
        <div class="seat-meta">
          <div class="seat-namerow"><span class="pname" id="pname-0"></span><span class="windchip" id="wind-0"></span></div>
          <div class="pscore" id="pscore-0"></div>
        </div>
        <div class="tags" id="tags-0"></div>
      </div>
    </div>

  </div>

  <div id="log-panel" class="log-panel">
    <div class="log-panel-head">대국 기록 <button id="log-close">✕</button></div>
    <div id="log"></div>
  </div>

  <div id="actions"></div>
</div>

<div id="overlay">
  <div class="overlay-box">
    <div class="overlay-ribbon" id="overlay-ribbon">화료</div>
    <pre id="overlay-text"></pre>
    <button id="overlay-close" class="bigbtn">다음 국으로</button>
  </div>
</div>

<script src="js/tiles.js"></script>
<script src="js/hand.js"></script>
<script src="js/yaku.js"></script>
<script src="js/personas.js"></script>
<script src="js/ai.js"></script>
<script src="js/game.js"></script>
</body>
</html>
